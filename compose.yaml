networks:
  auth:
    name: auth
    driver: bridge

volumes:
  database-1:
    name: auth-database-1
  database-2:
    name: auth-database-2
  database-3:
    name: auth-database-3
  cache:
    name: auth-cache

x-db-common: &db-common
  image: "cockroachdb/cockroach:latest-v26.1"
  restart: always
  networks:
    auth:

services:
  database-1:
    <<: *db-common
    container_name: auth-database-1
    command: start --insecure --http-addr=auth-database-1:8080 --listen-addr=auth-database-1:26357 --advertise-addr=auth-database-1:26357 --sql-addr=auth-database-1:26257 --join=auth-database-1:26357,auth-database-2:26357,auth-database-3:26357
    volumes:
      - database-1:/cockroach/cockroach-data

  database-2:
    <<: *db-common
    container_name: auth-database-2
    command: start --insecure --http-addr=auth-database-2:8080 --listen-addr=auth-database-2:26357 --advertise-addr=auth-database-2:26357 --sql-addr=auth-database-2:26257 --join=auth-database-1:26357,auth-database-2:26357,auth-database-3:26357
    volumes:
      - database-2:/cockroach/cockroach-data
    depends_on:
      database-1:
        condition: service_started

  database-3:
    <<: *db-common
    container_name: auth-database-3
    command: start --insecure --http-addr=auth-database-3:8080 --listen-addr=auth-database-3:26357 --advertise-addr=auth-database-3:26357 --sql-addr=auth-database-3:26257 --join=auth-database-1:26357,auth-database-2:26357,auth-database-3:26357
    volumes:
      - database-3:/cockroach/cockroach-data
    depends_on:
      database-1:
        condition: service_started

  init-cluster:
    image: "cockroachdb/cockroach:latest-v26.1"
    container_name: auth-database-init
    command: init --insecure --host=auth-database-1:26357
    networks:
      auth:
    depends_on:
      database-1:
        condition: service_started

  migrate-cluster:
    image: "cockroachdb/cockroach:latest-v26.1"
    container_name: auth-database-migrate
    command: sql --insecure --host=auth-database-1:26257 --file "/cockroach/migrations.sql"
    networks:
      auth:
    depends_on:
      database-1:
        condition: service_started
    volumes:
      - "./cockroach/migrations.sql:/cockroach/migrations.sql"

  seed-cluster:
    image: "cockroachdb/cockroach:latest-v26.1"
    container_name: auth-database-seed
    command: sql --insecure --host=auth-database-1:26257 --file "/cockroach/seeding.sql"
    networks:
      auth:
    depends_on:
      database-1:
        condition: service_started
    volumes:
      - "./cockroach/seeding.sql:/cockroach/seeding.sql"

  cache:
    image: valkey/valkey:9.0-alpine
    container_name: auth-cache
    entrypoint: valkey-server --appendonly yes --save 60 1
    networks:
      auth:
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "PING"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - cache:/data

  api:
    image: auth/api:0.1.0
    build: ./api
    container_name: auth-api
    networks:
      auth:
    depends_on:
      init-cluster:
        condition: service_completed_successfully
      cache:
        condition: service_started
    environment:
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 3000
      API_DATABASE_HOST: auth-database-1
      API_DATABASE_PORT: 26257
      API_DATABASE_NAME: dev
      API_CACHE_HOST: auth-cache
      API_CACHE_PORT: 6379

  app:
    image: auth/app:0.1.0
    build: ./app
    container_name: auth-app
    networks:
      auth:
    depends_on:
      api:
        condition: service_started
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3001

      NUXT_APP_BASE_URL: /
      NUXT_API_URL: http://auth-api:3000
