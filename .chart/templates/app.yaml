# auth-chart/templates/app.yaml
apiVersion: v1
kind: Service
metadata:
  name: auth-app
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: auth-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app
spec:
  replicas: { { .Values.app.replicas } }
  selector:
    matchLabels:
      app: auth-app
  template:
    metadata:
      labels:
        app: auth-app
    spec:
      containers:
        - name: app
          image: { { .Values.app.image } }
          ports:
            - containerPort: 3001
          env:
            - name: NITRO_HOST
              value: "0.0.0.0"
            - name: NITRO_PORT
              value: "3001"
            - name: NUXT_APP_BASE_URL
              value: "/"
            - name: NUXT_API_URL
              value: "http://auth-api:3000" # Wewnętrzny endpoint API w K8s
