apiVersion: v1
kind: Service
metadata:
  name: auth-api
spec:
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
  selector:
    app: auth-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      initContainers:
        - name: wait-for-db-bootstrap
          image: groundnuty/k8s-wait-for:v2.0
          args: ["job", "auth-database-bootstrap"]
        - name: wait-for-cache-bootstrap
          image: groundnuty/k8s-wait-for:v2.0
          args: ["job", "auth-cache-bootstrap"]
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: {{ .Values.api.port | quote }}
            - name: API_TOKEN_ISSUER
              value: {{ .Values.api.token.issuer | quote }}
            - name: API_TOKEN_SECRET
              value: {{ .Values.api.token.secret | quote }}
            - name: API_DATABASE_HOST
              value: "auth-database"
            - name: API_DATABASE_PORT
              value: "26257"
            - name: API_DATABASE_NAME
              value: {{ .Values.database.credentials.database | quote }}
            - name: API_DATABASE_USERNAME
              value: {{ .Values.database.credentials.username | quote }}
            - name: API_DATABASE_PASSWORD
              value: {{ .Values.database.credentials.password | quote }}
            - name: API_CACHE_HOST
              value: "auth-cache"
            - name: API_CACHE_PORT
              value: "6379"